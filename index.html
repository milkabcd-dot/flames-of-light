<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>תעלומת להבת הנר – מעבדת חקר אינטראקטיבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f9ff;--card:#fff;--line:#cfe0f7;--tx:#1b2a4e;--mu:#4a5b82;--blue:#1f5fd6;--deep:#1f3b8f;--gold:#e8860c;--sun:#ffd23f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#d9edff 0,#f6fbff 360px,#fff7e2 100%) fixed;color:var(--tx);font-family:"Heebo","Assistant","Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.7;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 60px}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;color:var(--deep)}
h1 span{display:block;color:var(--gold);font-size:.5em;font-weight:600;margin-top:.4em}
h2{font-size:1.7rem;color:var(--deep)}h3{font-size:1.15rem;color:#c2410c}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button,select,textarea{font:inherit}
.btn{background:var(--blue);color:#fff;border:0;border-radius:99px;padding:.55em 1.4em;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #153f95}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin:18px 0;box-shadow:0 4px 14px rgba(31,95,214,.08)}
.tag{display:inline-block;font-size:.85rem;border-radius:99px;padding:0 .9em;color:#fff;background:var(--blue);font-weight:700}
header.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);border-bottom:3px solid var(--sun)}
.prog{display:flex;gap:8px;max-width:860px;margin:0 auto;padding:10px 18px;align-items:center}
.prog b{font-size:.85rem;color:var(--mu);white-space:nowrap}
.seg{flex:1;height:14px;border-radius:9px;border:0;padding:0;cursor:pointer}
.seg.cur{outline:3px solid var(--deep);outline-offset:2px}
.hero{text-align:center;padding:30px 0 10px}
.flamebox{width:min(360px,92%);margin:0 auto 10px}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scaleY(1) skewX(0)}50%{transform:scaleY(1.07) skewX(2deg)}}
@media(prefers-reduced-motion:reduce){.flame{animation:none}html{scroll-behavior:auto}}
.q{margin:16px 0;padding-top:14px;border-top:2px dashed var(--line)}
.opt{display:block;width:100%;text-align:right;background:#f1f7ff;color:var(--tx);border:2px solid var(--line);border-radius:12px;padding:.6em .9em;margin:.4em 0;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:#dce9ff}
.opt.ok{border-color:#1a8f5a;background:#e3f8ee}.opt.no{border-color:#c0392b;background:#fdeceb}
.fb{margin-top:.6em;padding:.6em .9em;border-radius:12px;display:none}
.fb.show{display:block}.fb.good{background:#e3f8ee;border:2px solid #1a8f5a}.fb.warn{background:#fdeceb;border:2px solid #c0392b}.fb.info{background:#e8f1ff;border:2px solid #5b8def}
textarea{width:100%;min-height:90px;background:#f8fbff;color:var(--tx);border:2px solid var(--line);border-radius:12px;padding:.6em}
select{background:#f8fbff;color:var(--tx);border:2px solid var(--line);border-radius:8px;padding:.35em;max-width:100%}
ol.ord{list-style:none;padding:0;margin:0}
ol.ord li{display:flex;gap:8px;align-items:center;background:#f1f7ff;border:2px solid var(--line);border-radius:12px;padding:.4em .8em;margin:.35em 0}
ol.ord li span{flex:1}
.mv{background:var(--blue);color:#fff;border:0;border-radius:8px;width:2.2em;height:2.2em;cursor:pointer}
.mv:disabled{opacity:.3}
figure{margin:12px 0}figcaption{font-size:.85rem;color:var(--mu)}
figure img{max-width:100%;border-radius:12px}
.zone{cursor:pointer}.zone:hover{opacity:.85}.zone:focus-visible{outline:3px solid #fff}
table{width:100%;border-collapse:collapse;margin:10px 0}
th,td{border:1px solid var(--line);padding:.5em .7em;text-align:right;vertical-align:top;font-size:.95rem}
th{background:#e8f1ff;color:var(--deep)}
.ev{border-right:6px solid var(--sun);padding:.1em .9em;margin:12px 0;background:#fffbea;border-radius:10px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.note{font-size:.88rem;color:var(--mu)}
.bar{height:7px;border-radius:7px;width:96px;margin:0 0 12px}
.cr{font-weight:700;color:var(--deep)}
footer{border-top:3px solid var(--sun);margin-top:40px;padding-top:18px;text-align:center;color:var(--mu);font-size:.9rem}
section[hidden]{display:none}
details summary{cursor:pointer;color:var(--deep);font-weight:700}input[type=range]{accent-color:#e8860c}input[type=checkbox]{accent-color:#1f5fd6;width:1.1em;height:1.1em}
@media print{header.top,.nav,.btn{display:none}body{background:#fff}.card{box-shadow:none}}
@media(max-width:560px){body{font-size:17px}.card{padding:14px}}

.hero{position:relative;overflow:hidden;padding:26px 0 8px}
.ttl{margin:.1em 0;background:linear-gradient(90deg,#e53935,#fb8c00,#f9a825,#43a047,#039be5,#8e24aa,#e53935);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:300% 0}}
.sub{font-size:1.5rem;font-weight:800;color:var(--gold);margin:.2em 0}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card,.ev{animation:up .45s ease-out both}
@keyframes ign{from{transform:scale(0)}to{transform:scale(1)}}
.flame.lit{animation:ign .8s cubic-bezier(.2,1.6,.4,1) var(--d) both,fl 3s ease-in-out calc(var(--d) + .8s) infinite}
.spk{position:absolute;width:9px;height:9px;border-radius:50%;opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.cta{font-size:1.3rem;padding:.7em 2.2em;margin:10px 0;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.cn{background:none;border:0;padding:0;cursor:pointer;width:34px;height:46px;flex:none}
.cn.cur{outline:3px solid var(--deep);outline-offset:2px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0}
.sc{border:0;border-radius:18px;padding:16px;color:#fff;text-align:right;cursor:pointer;font-weight:800;font-size:1.1rem;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .15s}
.sc:hover{transform:translateY(-3px) rotate(-.6deg)}
.sc small{display:block;font-weight:600;font-size:.95rem}
.rise{transform-box:fill-box;animation:rs 2.4s ease-out infinite}
@keyframes rs{from{opacity:0;transform:translateY(16px)}30%{opacity:1}to{opacity:0;transform:translateY(-28px)}}
.inn{animation:inw 2.4s ease-in-out infinite}
@keyframes inw{0%,100%{opacity:.1}50%{opacity:1}}
.pulse{animation:pu 1.4s ease-in-out infinite}
@keyframes pu{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.art{position:relative;max-width:980px;margin:14px auto;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(31,59,143,.35),0 0 0 4px #fff,0 0 0 8px var(--sun);animation:flt 6s ease-in-out infinite}
.art img{display:block;width:100%;height:auto}
@keyframes flt{50%{transform:translateY(-4px)}}
.fg{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.85) 0,rgba(255,150,40,.4) 35%,rgba(255,150,40,0) 70%);mix-blend-mode:screen;pointer-events:none;opacity:.8;animation:fk var(--t) ease-in-out var(--d) infinite}
@keyframes fk{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.9)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}65%{opacity:.7;transform:translate(-50%,-50%) scale(1)}}
.em{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd98a;pointer-events:none;opacity:0;animation:emr 4s ease-out var(--d) infinite}
@keyframes emr{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(var(--x),-70px)}}
.newrow{animation:up .45s ease-out both}.newrow td{background:#fffbea}
.artcap{font-size:.85rem;color:var(--mu);margin:0 0 8px}
</style>
</head>
<body>
<header class="top"><div class="prog" id="prog" aria-label="התקדמות בפעילות"></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap">
<p class="cr" style="font-size:1.1rem">עריכה: מילכה ברקו גרש</p>
<p class="note">הפעילות פועלת בדפדפן בלבד. תשובות התלמידים אינן נשמרות ואינן נשלחות לשום שרת. התרשימים בפעילות סכמטיים ונוצרו לצורך ההוראה, ואינם צילומים. התמונות האמיתיות הן צילומי NASA. הסרטונים מוטמעים מיוטיוב ושייכים ליוצריהם.</p>
</footer>

function artPanel(src,alt,F,W,H,cap){
 const w=$("div",{class:"art"},$("img",{src:src,alt:alt}));
 F.forEach(([x,y,sz],i)=>{
  w.append($("span",{class:"fg","aria-hidden":"true",style:`left:${(x/W*100).toFixed(2)}%;top:${(y/H*100).toFixed(2)}%;width:${sz}%;--t:${(2.2+(i%5)*.45).toFixed(2)}s;--d:${((i*.37)%2).toFixed(2)}s`}));
  [0,1].forEach(j=>w.append($("span",{class:"em","aria-hidden":"true",style:`left:${(x/W*100+(j?1:-1)*.5).toFixed(2)}%;top:${((y-30)/H*100).toFixed(2)}%;--d:${((i*.6+j*1.9)%4).toFixed(2)}s;--x:${j?14:-14}px`})))});
